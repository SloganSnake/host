<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyTube">
  <title>MyTube</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Fredoka:wght@400;500;600;700&family=Bangers&family=Bungee&family=Creepster&family=Lobster&family=Monoton&family=Orbitron:wght@700&family=Pacifico&family=Permanent+Marker&family=Press+Start+2P&family=Rubik+Glitch&display=swap">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <div id="app">
    <main id="main"></main>

    <!-- Player: one persistent element that switches between full and mini mode -->
    <section id="player" class="hidden" aria-label="Video player">
      <div class="player-frame">
        <div id="yt-host"></div>
        <video id="local-video" playsinline controls preload="metadata"></video>
        <div class="mini-controls">
          <button id="mini-toggle" class="icon-btn" aria-label="Play or pause"></button>
          <button id="mini-close" class="icon-btn" aria-label="Close player"></button>
        </div>
        <button id="mini-expand" class="mini-expand" aria-label="Expand player"></button>
        <div class="mini-progress"><div id="mini-progress-bar"></div></div>
      </div>
      <div class="player-body" id="player-body"></div>
    </section>

    <nav id="tabbar">
      <a href="#home" data-tab="home"><span class="ico" data-icon="home"></span><span>Home</span></a>
      <a href="#shorts" data-tab="shorts"><span class="ico" data-icon="shorts"></span><span>Shorts</span></a>
      <button id="add-btn" class="add-btn" aria-label="Add video"><span class="ico" data-icon="plus"></span></button>
      <a href="#subs" data-tab="subs"><span class="ico" data-icon="subs"></span><span>Subscriptions</span></a>
      <a href="#you" data-tab="you"><span class="avatar-slot" id="tab-avatar"></span><span>You</span></a>
    </nav>

    <div id="sheet-root"></div>
    <div id="toast" role="status"></div>
  </div>

  <script src="app.js?v=6"></script>
  <script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
